name: Refresh CEB generation snapshot

# A static site can't fetch the CEB Generation Summary in-browser (no CORS), so
# snapshot it server-side on a schedule and commit it. The push triggers the
# Pages deploy (nextjs.yml), so the map updates with the fresh mix.
on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ceb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch CEB generation mix
        run: node scripts/build-ceb-generation.mjs
      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- public/data/ceb-generation.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/ceb-generation.json
            git commit -m "chore: refresh CEB generation snapshot [skip ci]"
            git push
          else
            echo "No change in CEB snapshot."
          fi
