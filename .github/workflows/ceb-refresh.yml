name: Refresh CEB generation snapshot

# A static site can't fetch the CEB Generation Summary in-browser (no CORS), so
# snapshot it server-side and commit it; the push triggers the Pages deploy.
#
# NOTE: GitHub's hosted runners (US) get an EMPTY response from edlcare.edl.lk —
# the CEB endpoint geo-restricts its content to Sri Lankan IPs. So a scheduled
# run here can't work; the refresh runs on a Sri Lanka host instead (LaunchAgent
# com.lanka-mapper.ceb-refresh -> scripts/ceb-refresh.sh). Kept for manual
# dispatch / documentation only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ceb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch CEB generation mix
        run: node scripts/build-ceb-generation.mjs
      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- public/data/ceb-generation.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/ceb-generation.json
            git commit -m "chore: refresh CEB generation snapshot [skip ci]"
            git push
          else
            echo "No change in CEB snapshot."
          fi
